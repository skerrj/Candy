# Packaging covers only the Candy runtime, ``src/cdy_rt`` (installed editable so generated code
# can import it). The Python driver, ``src/py_cdy``, is not packaged.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cdy-rt"
version = "0.0.1"
description = "Candy runtime: the Python spellings of the built-ins, and the primitives generated Python calls."
requires-python = ">=3.14"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["cdy_rt"]
package-data = { cdy_rt = ["py.typed"] }

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src/py_cdy", "src", "script"]

[tool.pylint.main]
init-hook = "import sys; sys.path[:0] = ['src/py_cdy', 'script']"
# mypy is compiled (mypyc); let pylint import it to see mypy.api.
extension-pkg-allow-list = ["mypy"]

[tool.pylint."messages control"]
# ruff sorts imports; pylint's import-order check disagrees with it about first-party modules.
disable = ["wrong-import-order"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
no-docstring-rgx = "^(_|test_)"

[tool.mypy]
strict = true
mypy_path = "src/py_cdy:script"

[tool.pytest.ini_options]
pythonpath = ["src/py_cdy", "script"]
testpaths = ["tst"]
# The bootstrap chain takes a minute: run it with `pytest -m bootstrap`.
addopts = '-m "not bootstrap"'
markers = ["bootstrap: runs the bootstrap chain (doc/hl_rqmt/bootstrap.md)"]

[tool.pyright]
extraPaths = ["src/py_cdy", "script"]
